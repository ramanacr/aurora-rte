<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="auroraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FF2E93" />
    </linearGradient>
    <linearGradient id="auroraAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#shieldGrad)" stroke="url(#auroraGlow)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Glowing Aurora Light Wave Ribbon -->
  <path d="M 64 256 C 140 140, 240 380, 360 180 C 420 100, 460 220, 448 300 C 430 410, 280 440, 160 360 Z"
        fill="none" stroke="url(#auroraGlow)" stroke-width="36" stroke-linecap="round" filter="url(#glow)" opacity="0.85"/>

  <!-- Secondary Dynamic Wave -->
  <path d="M 96 320 C 180 390, 300 200, 416 280"
        fill="none" stroke="url(#auroraAccent)" stroke-width="18" stroke-linecap="round" opacity="0.7"/>

  <!-- Central Modern Stylized Editor Nib & Caret -->
  <g transform="translate(256, 256)">
    <!-- Rotating Diamond Core -->
    <path d="M 0 -130 L 75 0 L 0 130 L -75 0 Z" fill="url(#auroraGlow)" filter="url(#glow)"/>
    <path d="M 0 -95 L 50 0 L 0 95 L -50 0 Z" fill="#0F172A"/>

    <!-- Precision Slit & Breather Hole -->
    <circle cx="0" cy="0" r="14" fill="#00F0FF" />
    <line x1="0" y1="14" x2="0" y2="120" stroke="#00F0FF" stroke-width="6" stroke-linecap="round" />

    <!-- Pulsing Caret Sparkles -->
    <polygon points="0,-160 -8,-140 0,-146 8,-140" fill="#FFFFFF" />
    <circle cx="-110" cy="-60" r="4" fill="#00F0FF" opacity="0.8"/>
    <circle cx="120" cy="50" r="5" fill="#FF2E93" opacity="0.9"/>
    <circle cx="90" cy="-110" r="3" fill="#10B981" opacity="0.85"/>
  </g>
</svg>
