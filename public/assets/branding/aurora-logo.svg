<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FF2E93" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="logoBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark (Scaled down from 512x512) -->
  <g transform="translate(10, 10) scale(0.39)">
    <rect width="512" height="512" rx="112" fill="#0F172A" stroke="url(#logoGlow)" stroke-width="6"/>
    <path d="M 64 256 C 140 140, 240 380, 360 180 C 420 100, 460 220, 448 300 C 430 410, 280 440, 160 360 Z"
          fill="none" stroke="url(#logoGlow)" stroke-width="36" stroke-linecap="round" filter="url(#logoBloom)" opacity="0.85"/>
    <g transform="translate(256, 256)">
      <path d="M 0 -130 L 75 0 L 0 130 L -75 0 Z" fill="url(#logoGlow)"/>
      <path d="M 0 -95 L 50 0 L 0 95 L -50 0 Z" fill="#0F172A"/>
      <circle cx="0" cy="0" r="14" fill="#00F0FF" />
      <line x1="0" y1="14" x2="0" y2="120" stroke="#00F0FF" stroke-width="6" stroke-linecap="round" />
    </g>
  </g>

  <!-- Brand Typography -->
  <!-- "AURORA" -->
  <text x="240" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
        font-size="80" font-weight="900" letter-spacing="6" fill="#F8FAFC">AURORA</text>

  <!-- "RTE" Pill Badge -->
  <g transform="translate(620, 52)">
    <rect width="135" height="68" rx="18" fill="url(#badgeGrad)" filter="url(#logoBloom)" opacity="0.95"/>
    <text x="67" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="40" font-weight="900" letter-spacing="2" fill="#020617" text-anchor="middle">RTE</text>
  </g>

  <!-- Tagline -->
  <text x="244" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="600" letter-spacing="4" fill="url(#logoGlow)">ENTERPRISE RICH-TEXT &amp; HTML5 AUTHORING ENGINE</text>
</svg>
