name: Release & Quality Gates

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test, Boundaries & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package boundaries
        run: pnpm check-boundaries

      - name: Run unit & property tests
        run: pnpm test

      - name: Run accessibility tests
        run: pnpm test:a11y

      - name: Run security tests
        run: pnpm test:security

      - name: Run performance benchmarks
        run: pnpm test:perf

      - name: Build packages
        run: pnpm build

  release:
    name: Production Packaging & Release
    needs: [verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release bundles
        run: pnpm build

      - name: Generate SHA-256 Checksums
        run: |
          mkdir -p dist/release
          tar -czf dist/release/aurora-editor-portable.tar.gz packages/
          sha256sum dist/release/aurora-editor-portable.tar.gz > dist/release/aurora-editor-portable.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/aurora-editor-portable.tar.gz
            dist/release/aurora-editor-portable.tar.gz.sha256
          draft: false
          prerelease: false
