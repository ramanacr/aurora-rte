<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0B1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ogAurora" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="30%" stop-color="#3B82F6" />
      <stop offset="65%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FF2E93" />
    </linearGradient>
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Background Aurora Glow Orbs -->
  <circle cx="1000" cy="150" r="280" fill="#00F0FF" opacity="0.12" filter="url(#ogGlow)" />
  <circle cx="200" cy="500" r="320" fill="#8B5CF6" opacity="0.15" filter="url(#ogGlow)" />
  <circle cx="600" cy="50" r="240" fill="#FF2E93" opacity="0.10" filter="url(#ogGlow)" />

  <!-- Header Section: Logo + Badge -->
  <g transform="translate(80, 80)">
    <!-- Icon -->
    <rect width="90" height="90" rx="22" fill="#0F172A" stroke="url(#ogAurora)" stroke-width="3"/>
    <circle cx="45" cy="45" r="20" fill="none" stroke="url(#ogAurora)" stroke-width="4" />
    <circle cx="45" cy="45" r="6" fill="#00F0FF" />

    <!-- Brand Name -->
    <text x="115" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="64" font-weight="900" letter-spacing="4" fill="#FFFFFF">AURORA</text>
    <g transform="translate(420, 16)">
      <rect width="95" height="52" rx="14" fill="url(#ogAurora)" />
      <text x="47" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="30" font-weight="900" fill="#020617" text-anchor="middle">RTE</text>
    </g>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="46" font-weight="800" fill="#F8FAFC">Enterprise Rich-Text &amp; HTML5 Authoring Engine</text>
  
  <text x="80" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="24" font-weight="400" fill="#94A3B8">Next-generation framework-agnostic editor with real-time collaboration, bi-directional HTML</text>
  <text x="80" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="24" font-weight="400" fill="#94A3B8">source mode, interactive table resizing, and enterprise track-changes review workflows.</text>

  <!-- Framework Feature Badges -->
  <g transform="translate(80, 390)">
    <!-- Badge 1: React 19 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="56" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
      <text x="105" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="20" font-weight="700" fill="#38BDF8" text-anchor="middle">⚛️ React 19 Ready</text>
    </g>
    <!-- Badge 2: Angular 17+ -->
    <g transform="translate(230, 0)">
      <rect width="220" height="56" rx="14" fill="#1E293B" stroke="#F43F5E" stroke-width="1.5" />
      <text x="110" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="20" font-weight="700" fill="#F43F5E" text-anchor="middle">🅰️ Angular 17+ Native</text>
    </g>
    <!-- Badge 3: Web Component -->
    <g transform="translate(470, 0)">
      <rect width="240" height="56" rx="14" fill="#1E293B" stroke="#A855F7" stroke-width="1.5" />
      <text x="120" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="20" font-weight="700" fill="#A855F7" text-anchor="middle">🧩 Web Components</text>
    </g>
    <!-- Badge 4: WCAG 2.1 AA -->
    <g transform="translate(730, 0)">
      <rect width="200" height="56" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
      <text x="100" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="20" font-weight="700" fill="#10B981" text-anchor="middle">♿ WCAG 2.1 AA</text>
    </g>
  </g>

  <!-- Bottom Bar with GitHub URL and Version -->
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#334155" stroke-width="1" />
  <g transform="translate(80, 565)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="20" font-weight="600" fill="#00F0FF">🌐 https://ramanacr.github.io/aurora-rte/</text>
    <text x="1040" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="20" font-weight="600" fill="#64748B" text-anchor="end">v0.1.0 • Open Source • MIT</text>
  </g>
</svg>
