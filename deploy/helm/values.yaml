replicaCount: 2

image:
  repository: ghcr.io/aurora-rte/enterprise-services
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aurora.local
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

env:
  NODE_ENV: production
  LOG_LEVEL: info
  ENABLE_TELEMETRY: "false"

postgresql:
  enabled: true
  auth:
    database: aurora_db
    username: aurora_user
    password: changeme-in-production
