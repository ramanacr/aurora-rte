services:
  aurora-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurora-editor-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgres://aurora:aurorapass@aurora-postgres:5432/aurora
    depends_on:
      aurora-postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  aurora-postgres:
    image: postgres:16-alpine
    container_name: aurora-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=aurora
      - POSTGRES_USER=aurora
      - POSTGRES_PASSWORD=aurorapass
    volumes:
      - ./services/review/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - aurora_pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  aurora_pg_data:
